name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - feature/personal-portfolio
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - feature/personal-portfolio

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Publish Blazor WASM
        run: dotnet publish src/UI/Friday.Portfolio/Friday.Portfolio.csproj -c Release -o output

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_FOREST_0BE968C00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Cấu hình folder sau khi đã publish ######
          app_location: "output/wwwroot" # Thư mục chứa web sau khi dotnet publish
          api_location: ""
          output_location: ""
          skip_app_build: true # Báo cho Azure bỏ qua bước build ngầm và chỉ upload
          #################################################

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_FOREST_0BE968C00 }}
          action: "close"
